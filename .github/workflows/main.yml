name: Build TVMate Pro APK
on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.7" }

      - name: Proje iskeletini hazirla
        run: |
          A=app/src/main
          mkdir -p $A/assets $A/res/values $A/res/drawable $A/java/com/tvmate/pro

          # Oynatma native Media3 ile yapılır; web hls.js/mpegts.js APK'dan çıkarılır
          cp tvmate-pro-player.html $A/assets/index.html
          cp web/tv-remote.js web/tv-remote.css web/native-player.js $A/assets/
          python3 - <<'PY'
          import re
          p='app/src/main/assets/index.html'
          s=open(p,encoding='utf-8').read()
          s=re.sub(r'<script src="https://cdn\.jsdelivr\.net/npm/(hls|mpegts)\.js@[^"]*"></script>','',s)
          s=s.replace('</body>','<link rel="stylesheet" href="tv-remote.css"><script src="tv-remote.js"></script><script src="native-player.js"></script></body>')
          open(p,'w',encoding='utf-8').write(s)
          PY

          cp android/MainActivity.java $A/java/com/tvmate/pro/MainActivity.java
          cp android/AndroidManifest.xml $A/AndroidManifest.xml

          echo 'android.useAndroidX=true' > gradle.properties
          printf "rootProject.name = 'TVMatePro'\ninclude ':app'\n" > settings.gradle
          cat > build.gradle <<'G'
          buildscript {
            repositories { google(); mavenCentral() }
            dependencies { classpath 'com.android.tools.build:gradle:8.5.2' }
          }
          allprojects { repositories { google(); mavenCentral() } }
          G
          cat > app/build.gradle <<'G'
          plugins { id 'com.android.application' }
          android {
            namespace "com.tvmate.pro"
            compileSdk 34
            defaultConfig { applicationId "com.tvmate.pro"; minSdk 21; targetSdk 34; versionCode 2; versionName "1.1" }
            compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
          }
          dependencies {
            implementation 'androidx.appcompat:appcompat:1.6.1'
            implementation 'androidx.webkit:webkit:1.8.0'
            implementation 'androidx.media3:media3-exoplayer:1.3.1'
            implementation 'androidx.media3:media3-exoplayer-hls:1.3.1'
            implementation 'androidx.media3:media3-ui:1.3.1'
          }
          G
          echo '<resources><string name="app_name">TVMate Pro</string></resources>' > $A/res/values/strings.xml
          mkdir -p $A/res/layout
          cat > $A/res/layout/player_view.xml <<'G'
          <androidx.media3.ui.PlayerView xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:app="http://schemas.android.com/apk/res-auto"
              android:layout_width="match_parent" android:layout_height="match_parent"
              android:visibility="gone" android:background="#000000"
              app:use_controller="false" app:surface_type="texture_view" app:resize_mode="fit"/>
          G
          cat > $A/res/drawable/ic_launcher.xml <<'G'
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="96dp" android:height="96dp" android:viewportWidth="96" android:viewportHeight="96">
            <path android:fillColor="#3B82F6" android:pathData="M0,0h96v96h-96z"/>
            <path android:fillColor="#FFFFFF" android:pathData="M36,26L72,48L36,70Z"/>
          </vector>
          G
          cat > $A/res/drawable/banner.xml <<'G'
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="320dp" android:height="180dp" android:viewportWidth="320" android:viewportHeight="180">
            <path android:fillColor="#090D14" android:pathData="M0,0h320v180h-320z"/>
            <path android:fillColor="#3B82F6" android:pathData="M120,50L210,90L120,130Z"/>
          </vector>
          G

      - run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: tvmate-pro-apk
          path: app/build/outputs/apk/debug/app-debug.apk
